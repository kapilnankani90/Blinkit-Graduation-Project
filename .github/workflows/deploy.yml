name: CI & Deployment Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-backend:
    name: Verify Backend Python Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Syntax & Import Check
        run: |
          python -m py_compile main.py

  verify-frontend:
    name: Verify Frontend Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Verify Key Artifacts
        run: |
          test -f index.html
          test -f app.js
          test -f vercel.json
          test -f railway.json
